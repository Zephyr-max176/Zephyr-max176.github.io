  // 获取某市的区县数据（浙江省专用）
  function getDistrictsForCityInZhejiang(cityName) {
    const cityInfo = zhejiangRealData[cityName];
    if (!cityInfo) return null;
    // 返回一个对象，包含市级热线和各个区县的热线列表
    return cityInfo;
  }

  // ======================= 5. 渲染省份详情 =======================
  function renderProvinceDetail(provinceName) {
    const provinceHotline = provinceHotlineMap[provinceName] || "暂无专属省级热线，请优先拨打全国 12355 或 12356（24小时）";
    let html = `
      <div class="province-hotline-card">
        <div style="font-weight:700; margin-bottom:8px;">📞 ${provinceName} 省级心理援助热线</div>
        <div class="hotline-number" style="font-size:18px;">${provinceHotline}</div>
        <div class="hotline-time">* 若占线或所在区县无专线，请直接拨打全国热线12355</div>
      </div>
      <div class="city-list">
    `;
    const cities = citiesByProvince[provinceName] || [`${provinceName}主城区`];
    for (let city of cities) {
      const cityId = `city-${provinceName.replace(/\s/g,'')}-${city}`.replace(/[^a-zA-Z0-9\u4e00-\u9fa5-]/g,'');
      // 判断是否是浙江省并且有真实区县数据
      let districtHtml = '';
      if (provinceName === "浙江省" && zhejiangRealData[city]) {
        const cityData = zhejiangRealData[city];
        // 先展示市级热线
        if (cityData["市级"]) {
          for (let hot of cityData["市级"]) {
            districtHtml += `
              <div class="district-item">
                <div class="district-name">${hot.name}</div>
                <div class="district-phone">${hot.phone}</div>
                <div class="district-time">⏱️ ${hot.time}</div>
              </div>
            `;
          }
        }
        // 再展示各区县
        for (let [districtName, hotlines] of Object.entries(cityData)) {
          if (districtName === "市级") continue;
          for (let hot of hotlines) {
            districtHtml += `
              <div class="district-item">
                <div class="district-name">${districtName}</div>
                <div class="district-phone">${hot.phone}</div>
                <div class="district-time">⏱️ ${hot.time}</div>
              </div>
            `;
          }
        }
      } else {
        // 其他省份：不伪造数据，显示友好的引导信息
        districtHtml = `
          <div class="no-data-note">
            📢 我们正在努力收集 ${city} 所有区县的热线。<br>
            您可以先拨打 <strong>${provinceName} 省级热线</strong> 或 <strong>全国 12355</strong> 获取就近帮助。<br>
            也可通过当地卫健委、教育局官网查询。
          </div>
        `;
      }
      html += `
        <div class="city-card">
          <div class="city-header" data-target="${cityId}">
            <div class="city-name">🏙️ ${city}</div>
            <div class="toggle-icon">▼</div>
          </div>
          <div id="${cityId}" class="district-list">
            ${districtHtml}
          </div>
        </div>
      `;
    }
    html += `</div><div class="footer-note">✅ 浙江省所有区县热线均为真实官方号码（宁波市全覆盖）。其他省份数据持续更新中，若您有当地热线欢迎反馈。</div>`;
    return html;
  }

  // 折叠展开绑定
  function bindToggleEvents() {
    document.querySelectorAll('.city-header').forEach(header => {
      header.removeEventListener('click', toggleHandler);
      header.addEventListener('click', toggleHandler);
    });
  }
  function toggleHandler(e) {
    const targetId = this.getAttribute('data-target');
    const districtDiv = document.getElementById(targetId);
    if (districtDiv) {
      districtDiv.classList.toggle('show');
      const icon = this.querySelector('.toggle-icon');
      if (icon) icon.textContent = districtDiv.classList.contains('show') ? '▲' : '▼';
    }
  }

  function renderHome() {
    const container = document.getElementById('provinceList');
    if (!container) return;
    container.innerHTML = '';
    for (let p of allProvinces) {
      const btn = document.createElement('div');
      btn.className = 'province-btn';
      btn.textContent = p;
      btn.addEventListener('click', () => showProvinceDetail(p));
      container.appendChild(btn);
    }
  }

  function showProvinceDetail(provinceName) {
    document.getElementById('homeView').style.display = 'none';
    const detailView = document.getElementById('detailView');
    detailView.style.display = 'block';
    const detailContent = document.getElementById('detailContent');
    detailContent.innerHTML = renderProvinceDetail(provinceName);
    bindToggleEvents();
    window.scrollTo(0,0);
  }

  function backToHome() {
    document.getElementById('homeView').style.display = 'block';
    document.getElementById('detailView').style.display = 'none';
    window.scrollTo(0,0);
  }

  function init() {
    renderHome();
    document.getElementById('backHomeBtn').addEventListener('click', backToHome);
    document.getElementById('homeView').style.display = 'block';
    document.getElementById('detailView').style.display = 'none';
  }
  init();
</script>
